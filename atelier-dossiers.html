<!doctype html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Atelier de Dossiers</title>

        <link rel="stylesheet" href="./app.css" />
    </head>
    <body>
        <div id="app">
            <div class="topbar">
                <div class="brand">
                    Atelier de Dossiers<small
                        >Éditeur de fiches de lore — style classification</small
                    >
                </div>
                <button id="btn-new">+ Nouveau document</button>
                <label class="file-btn"
                    >Importer JSON<input
                        type="file"
                        id="file-import"
                        accept="application/json"
                /></label>
                <button id="btn-export-json">Exporter JSON</button>
                <button id="btn-registry">Registre des couleurs</button>
                <button class="primary" id="btn-pdf">Exporter en PDF</button>
            </div>
            <div class="body-wrap">
                <div class="sidebar" id="sidebar"></div>
                <div class="preview-wrap" id="preview"></div>
            </div>
        </div>

        <div
            id="registry-modal"
            style="
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.4);
                z-index: 50;
                align-items: center;
                justify-content: center;
            "
        >
            <div
                style="
                    background: #fff;
                    border-radius: 10px;
                    padding: 22px;
                    width: 480px;
                    max-height: 80vh;
                    overflow-y: auto;
                "
            >
                <div
                    style="
                        display: flex;
                        align-items: center;
                        justify-content: space-between;
                    "
                >
                    <h3 style="margin: 0">Registre des couleurs utilisées</h3>
                    <button
                        id="btn-modal-edit"
                        title="Modifier / retirer des couleurs"
                        style="
                            background: none;
                            border: 1px solid #d8d4c8;
                            border-radius: 4px;
                            width: 28px;
                            height: 28px;
                            font-size: 13px;
                            color: #7a746a;
                        "
                    >
                        ✎
                    </button>
                </div>
                <p style="font-size: 12.5px; color: #666">
                    Toutes les couleurs déjà attribuées à un document, tous
                    documents confondus. Sert à garantir l'unicité des
                    propositions.
                </p>
                <div
                    class="registry-list"
                    id="registry-list-full"
                    style="max-height: 280px"
                ></div>
                <div style="display: flex; gap: 8px; margin-top: 14px">
                    <button
                        id="btn-registry-export"
                        style="
                            flex: 1;
                            padding: 8px;
                            border-radius: 6px;
                            border: 1px solid #ccc;
                            background: #f4f2ea;
                        "
                    >
                        Exporter le registre (JSON)
                    </button>
                    <label
                        class="file-btn"
                        style="
                            flex: 1;
                            text-align: center;
                            background: #f4f2ea;
                            color: #1a1a1a;
                            border: 1px solid #ccc;
                            padding: 8px;
                            border-radius: 6px;
                            cursor: pointer;
                        "
                    >
                        Importer / fusionner<input
                            type="file"
                            id="registry-import"
                            accept="application/json"
                            style="display: none"
                        />
                    </label>
                </div>
                <button
                    id="btn-registry-close"
                    style="
                        margin-top: 12px;
                        width: 100%;
                        padding: 8px;
                        border-radius: 6px;
                        border: none;
                        background: #1b1b1a;
                        color: #fff;
                    "
                >
                    Fermer
                </button>
            </div>
        </div>

        <script src="./app.js"></script>
    </body>
</html>
